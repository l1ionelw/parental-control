<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Blocked - Parental Controls</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0f172a;
      color: #e2e8f0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    }
    .card {
      text-align: center;
      padding: 2.5rem;
      max-width: 26rem;
    }
    .icon {
      font-size: 2.5rem;
      margin-bottom: 0.75rem;
    }
    h1 {
      font-size: 1.25rem;
      margin: 0 0 0.5rem;
    }
    p {
      color: #94a3b8;
      font-size: 0.9rem;
      line-height: 1.5;
      margin: 0;
    }
    .domain {
      font-family: monospace;
      color: #e2e8f0;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">&#128274;</div>
    <h1>Daily time limit reached</h1>
    <p><span class="domain" id="domain"></span> is blocked for the rest of today. It'll be available again tomorrow.</p>
  </div>
  <script src="blocked.js"></script>
</body>
</html>
