# Alembic configuration for the parental-control server.
#
# Usage (run from the server/ directory):
#   alembic revision --autogenerate --rev-id 001 -m "create initial table"
#     -> generates migrations/versions/001_create_initial_table.py
#   alembic upgrade head        # apply (NOT run yet)
#   alembic downgrade -1        # roll back one

[alembic]
# Location of the migration environment (env.py, versions/).
script_location = migrations

# Add the server/ dir (this file's dir) to sys.path so env.py can `import models`.
prepend_sys_path = .

# Migration filenames: <rev-id>_<slugified-message>, e.g. 001_create_initial_table.py
# --rev-id supplies %(rev)s (001), -m/--message supplies %(slug)s.
file_template = %%(rev)s_%%(slug)s
truncate_slug_length = 40

# SQLite database file (created relative to the current working directory).
sqlalchemy.url = sqlite:///parental_control.db


# ---------------------------------------------------------------------------
# Logging configuration
# ---------------------------------------------------------------------------
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
